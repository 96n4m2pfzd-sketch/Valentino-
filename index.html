<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniFacebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f0f2f5] font-sans text-gray-800">

    <!-- HEADER -->
    <header class="bg-white h-14 shadow fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4">
        <div class="flex items-center space-x-2">
            <div class="bg-[#1877f2] text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-2xl">f</div>
            <h1 class="font-bold text-xl text-[#1877f2] hidden sm:block">MiniFacebook</h1>
        </div>
        <div class="flex items-center space-x-2">
            <div class="bg-gray-200 w-10 h-10 rounded-full flex items-center justify-center font-bold text-gray-600">TU</div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="pt-20 max-w-xl mx-auto p-4">
        
        <!-- BOX CREAZIONE POST -->
        <div class="bg-white p-4 rounded-lg shadow mb-4">
            <div class="flex items-center space-x-2 pb-3 border-b">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">TU</div>
                <input type="text" id="postInput" placeholder="A cosa stai pensando?" class="bg-[#f0f2f5] p-2.5 rounded-full w-full outline-none">
            </div>
            <div class="flex justify-end pt-3">
                <button onclick="createPost()" class="bg-[#1877f2] text-white font-semibold px-6 py-2 rounded-lg hover:bg-blue-600 transition">Pubblica</button>
            </div>
        </div>

        <!-- FEED -->
        <div id="feedContainer" class="space-y-4">
            <!-- Post di esempio predefinito -->
            <div class="bg-white p-4 rounded-lg shadow" id="post-sample">
                <div class="flex items-center mb-2">
                    <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center text-white font-bold mr-3">MR</div>
                    <div>
                        <h3 class="font-bold text-gray-800">Mario Rossi</h3>
                        <span class="text-xs text-gray-500">Oggi</span>
                    </div>
                </div>
                <p class="text-gray-700 mb-3">Benvenuto nella tua bacheca! I tasti ora funzionano perfettamente. Prova a mettere un like o a commentare qua sotto 👇</p>
                
                <div class="border-t border-b py-1 flex justify-around text-gray-600 font-semibold text-sm">
                    <button onclick="likePost(this)" class="hover:bg-gray-100 w-full py-1.5 rounded text-center">👍 Mi piace (<span class="like-count">3</span>)</button>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT -->
    <script>
        function createPost() {
            const input = document.getElementById('postInput');
            const content = input.value.trim();

            if (!content) {
                alert("Scrivi qualcosa prima di pubblicare!");
                return;
            }

            const feed = document.getElementById('feedContainer');

            const postDiv = document.createElement('div');
            postDiv.className = "bg-white p-4 rounded-lg shadow";
            postDiv.innerHTML = `
                <div class="flex items-center mb-2">
                    <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold mr-3">TU</div>
                    <div>
                        <h3 class="font-bold text-gray-800">Tu</h3>
                        <span class="text-xs text-gray-500">Proprio ora</span>
                    </div>
                </div>
                <p class="text-gray-700 mb-3">${content}</p>
                <div class="border-t border-b py-1 flex justify-around text-gray-600 font-semibold text-sm">
                    <button onclick="likePost(this)" class="hover:bg-gray-100 w-full py-1.5 rounded text-center">👍 Mi piace (<span class="like-count">0</span>)</button>
                </div>
            `;

            feed.prepend(postDiv);
            input.value = ""; // Pulisce la casella di testo
        }

        function likePost(button) {
            const spanCount = button.querySelector('.like-count');
            let currentLikes = parseInt(spanCount.textContent);
            currentLikes++;
            spanCount.textContent = currentLikes;
            button.classList.add('text-blue-600');
        }
    </script>
</body>
</html>
